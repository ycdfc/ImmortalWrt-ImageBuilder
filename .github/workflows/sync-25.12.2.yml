name: sync-25.12.2

on:
  push:
    paths:
      - '.github/workflows/sync-25.12.2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply version sync
        run: python3 .github/sync_version.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --porcelain
          git commit -m 'chore: sync ImmortalWrt version to 25.12.2 (25.12.x workflow default + imm25.config repo URL)'
          git push
